name: Txnly

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"
    # Weekly on Sunday at 08:00 UTC
    - cron: "0 8 * * 0"
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run finance tracker
        env:
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL || 'INFO' }}
          REPORT_DAILY: ${{ secrets.REPORT_DAILY || 'true' }}
          REPORT_WEEKLY: ${{ secrets.REPORT_WEEKLY || 'true' }}
          SUBJECT_KEYWORDS: ${{ secrets.SUBJECT_KEYWORDS || 'MoMo,Debit Alert,Credit Alert' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python main.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-logs
          path: logs/
